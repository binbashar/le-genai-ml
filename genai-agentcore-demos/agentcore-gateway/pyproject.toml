[project]
name = "agentcore-gateway"
version = "0.1.0"
description = "Generic AgentCore MCP Gateway infrastructure for exposing tools as serverless functions"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "boto3>=1.40.27",
    "botocore>=1.35.85",
    "requests>=2.32.3",
    "requests-aws4auth>=1.3.1",
    "pyyaml>=6.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "black>=25.1.0",
    "mypy>=1.14.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infrastructure", "tools", "scripts"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
