[project]
name = "genai-agentcore-demos"
version = "0.1.0"
description = "Shared utilities for AWS Bedrock AgentCore demos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "pip",
    "aiohttp",
    "requests",
    "python-dotenv",
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
    "PyJWT>=2.10.0",
    "aws-cdk-lib>=2.221.0",
    "constructs>=10.0.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools]
packages = ["shared"]
