[project]
name = "genai-agentcore-demos"
version = "0.1.0"
description = "Shared utilities for AWS Bedrock AgentCore demos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "pip",
    "aiohttp",
    "requests",
    "python-dotenv",
    "bedrock-agentcore",
    "bedrock-agentcore-starter-toolkit",
    "PyJWT>=2.10.0",
    "aws-cdk-lib>=2.221.0",
    "constructs>=10.0.0",
    "pyyaml>=6.0.3",
    "ipython",
    "jupyter",
    "ipykernel",
    "matplotlib",
    "strands-agents",
    "strands-agents-tools",
    "yfinance"
]

[tool.setuptools]
packages = ["shared"]

[tool.uv.workspace]
members = [
    "evaluation-pipeline/cdk",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
]
