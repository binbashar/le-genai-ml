[project]
name = "finance-assistant"
version = "0.1.0"
description = "Personal finance assistant built with Strands agents and AWS Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "bedrock-agentcore==0.1.3",
    "bedrock-agentcore-starter-toolkit==0.1.10",
    "boto3==1.40.27",
    "strands-agents>=1.7.1",
    "strands-agents-tools>=0.2.6",
    "pydantic>=2.11.7",
    "pandas>=2.3.2",
    "matplotlib>=3.10.6",
    "yfinance>=0.2.65",
    "langgraph>=1.0.1",
    "langchain-aws>=1.0.0",
    "langchain-core>=1.0.0",
    "aiohttp",
    "aws-cdk-lib",
    "constructs",
    "Pillow>=10.0.0",  # Image processing for vision capability
    "PyMuPDF>=1.24.0",  # PDF to image conversion (pure Python, no system deps)
    "PyJWT>=2.10.0",
    "requests>=2.32.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "playwright>=1.40.0",  # AgentCore Browser automation
    "nest-asyncio>=1.5.0",  # Async support for browser tool
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "autopep8>=2.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["utils"]
