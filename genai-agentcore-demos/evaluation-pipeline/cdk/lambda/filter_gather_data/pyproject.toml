[project]
name = "filter-gather-data"
version = "1.0.0"
description = "Lambda function to filter staging data and generate Bedrock evaluation datasets"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35.0",
    "pyarrow>=23.0.1",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
