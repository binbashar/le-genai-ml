[project]
name = "browser-agent"
version = "0.1.0"
description = "Browser automation agent using AWS Bedrock AgentCore and Strands"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    # AgentCore Runtime
    "bedrock-agentcore>=0.1.3",
    "bedrock-agentcore-starter-toolkit>=0.1.10",

    # Strands Agent Framework
    "strands-agents>=1.7.1",
    "strands-agents-tools>=0.2.6",

    # Browser Automation
    "playwright>=1.40.0",
    "nest-asyncio>=1.5.0",

    # AWS SDK
    "boto3>=1.40.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
