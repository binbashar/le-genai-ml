[project]
name = "chat-agent"
version = "0.1.0"
description = "Basic LangGraph chat agent with AgentCore Memory for experimentation"
requires-python = ">=3.13"

dependencies = [
    "bedrock-agentcore>=0.1.3",
    "bedrock-agentcore-starter-toolkit>=0.1.10",
    "boto3>=1.40.27",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-aws>=0.1.0",
    "langchain-aws>=1.0.0",
    "langchain-core>=1.3.3",
    "aiohttp",
    "pyyaml>=6.0",
    "python-dotenv>=1.1.1",
]

[tool.setuptools]
py-modules = ["main", "config"]
