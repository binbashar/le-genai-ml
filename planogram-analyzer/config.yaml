default_prompt: |
  Te estoy adjuntando 2 imágenes:
  - La PRIMERA imagen es el PLANOGRAMA que indica cómo se DEBEN exhibir los productos en una góndola (exhibición ESPERADA/DESEADA).
  - La SEGUNDA imagen es el REALOGRAMA (exhibición REAL/ACTUAL) de control que muestra cómo están exhibidos los productos realmente en la tienda.

  Como información adicional MUY IMPORTANTE, te paso un JSON detallado que describe TODOS los productos que aparecen en el planograma con su estructura esperada.

  Tu tarea será encontrar TODAS las diferencias entre el planograma y el realograma, modificando en el JSON provisto según el resultado de la comparación las siguientes propiedades de cada producto:

  1. "encontrado": true si el producto exacto fue encontrado en el realograma, false si no está
  2. "posicion_correcta": true si está en la posición correcta (mismo nivel y orden), false si no
  3. "frentes_encontrados": cantidad exacta de frentes visibles del producto en el realograma

  PROCESO DE ANÁLISIS DETALLADO:

  1. IDENTIFICACIÓN DE NIVELES:
     - Nivel 1 = Estante superior
     - Los niveles se incrementan hacia abajo
     - Verifica que estés mirando el nivel correcto en el realograma

  2. IDENTIFICACIÓN DE PRODUCTOS:
     - Compara marca, tipo de envase (lata/botella), y tamaño (500ml, 1L, etc.)
     - Un producto es "encontrado" SOLO si coincide exactamente (ej: "Stella Artois Lata 500ml" ≠ "Stella Artois Botella 1L")

  3. VERIFICACIÓN DE POSICIÓN:
     - Cuenta de IZQUIERDA a DERECHA en cada nivel
     - La posición 1 es el producto más a la izquierda
     - "posicion_correcta" = true SOLO si está en la misma posición numérica

  4. CONTEO DE FRENTES (MUY IMPORTANTE):
     - Un frente = una cara frontal completa del producto visible
     - Si ves 3 latas del mismo producto lado a lado = 3 frentes
     - Si ves 6 botellas del mismo producto = 6 frentes
     - CUENTA VARIAS VECES para asegurarte del número correcto
     - Registra el total en "frentes_encontrados"

  5. DETECCIÓN DE ANOMALÍAS:
     - Identifica productos en el realograma que NO están en el planograma
     - Identifica espacios vacíos donde debería haber productos
     - Nota si hay productos de otras marcas ocupando espacios planogramados

  6. DETECCIÓN DE ESPACIOS VACÍOS (CRÍTICO):
     - Examina cuidadosamente cada nivel buscando espacios sin productos
     - Un espacio vacío es cualquier área donde debería haber un producto según el planograma pero no hay nada
     - Reporta la ubicación exacta de cada espacio vacío (nivel y posición aproximada)
     - Los espacios vacíos son críticos para el reabastecimiento

  CONCLUSIONES A INCLUIR:
  - Lista de TODOS los productos faltantes (no encontrados)
  - Lista de productos mal posicionados
  - Productos con diferencias significativas en cantidad de frentes
  - Productos no planogramados que aparecen en el realograma
  - ESPACIOS VACÍOS detectados (ubicación y tamaño)
  - Porcentaje de cumplimiento general
  - Recomendaciones específicas de corrección

  IMPORTANTE:
  - SÉ MUY PRECISO en el conteo de frentes - cuenta múltiples veces
  - NO asumas que un producto está si no puedes verlo claramente
  - Verifica CADA producto del JSON sin excepción
  - Si un producto está parcialmente oculto pero identificable, cuenta solo los frentes visibles
  - SIEMPRE reporta espacios vacíos en las conclusiones

  ⚠️ REGLAS DE FORMATO ESTRICTO (OBLIGATORIAS):
  - Devuelve EXCLUSIVAMENTE un JSON válido, sin texto adicional, sin markdown, sin comentarios.
  - El JSON DEBE tener exactamente estas claves raíz: "diferencias" (array) y "conclusiones" (array).
  - Cada item en "diferencias" tiene la forma:
    {
      "nivel": <número>,
      "resultado": {
        "productos": [
          {
            "posicion_producto": <número>,
            "nombre": <string>,
            "encontrado": <true|false>,
            "posicion_correcta": <true|false>,
            "frentes_esperados": <número>,
            "frentes_encontrados": <número>
          }
        ]
      }
    }
  - "conclusiones" es un array de strings.
  - NO incluyas otras claves en la raíz (nada de "gondola", "productos", "metricas", "observaciones", etc.).
  - Recorre TODO el JSON de planograma entregado y para CADA producto devuelve su evaluación.
  - Si hay productos no planogramados en el realograma, menciónalo SOLO en "conclusiones".
  - Si no puedes confirmar un producto, usa: "encontrado": false, "posicion_correcta": false, "frentes_encontrados": 0.
  - No inventes datos ni alteres el nombre/tamaño/envase del JSON base.

# Configuración de Rekognition
rekognition:
  confidence_threshold: 80
  max_labels: 100
  detect_text: true
  detect_moderation: false
  
  # Categorías relevantes para detección de productos
  relevant_categories:
    - Bottle
    - Can
    - Package
    - Box
    - Container
    - Product
    - Beverage
    - Food
    - Snack
    - Cosmetics
    - Cleaning Product
    - Aerosol
    - Spray
    - Wipes
    - Jar
    - Tube
    - Packet

# Configuración de análisis
analysis:
  grid_rows: 6  # Número de niveles de estantes
  grid_cols: 12  # Divisiones horizontales para detección de vacíos
  empty_space_threshold: 0.2  # Umbral para considerar un espacio como vacío
  similarity_threshold: 0.7  # Umbral para matching de productos

# Configuración de la aplicación
app:
  max_image_size: 2048  # Tamaño máximo de imagen en píxeles
  image_quality: 95  # Calidad de compresión JPEG
  session_timeout: 3600  # Timeout de sesión en segundos
  enable_debug: false  # Modo debug